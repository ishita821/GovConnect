<!DOCTYPE html>
<html>
<head>
    <title>Apply for Service</title>
</head>
<body>

<h2>Government Service Application</h2>

<form action="/apply" method="POST" enctype="multipart/form-data">

<label>Full Name</label><br>
<input type="text" name="fullname" required><br><br>

<label>Aadhaar Number</label><br>
<input type="text" name="aadhaar" maxlength="12" required><br><br>

<label>Mobile Number</label><br>
<input type="text" name="mobile" maxlength="10" required><br><br>

<label>Address</label><br>
<textarea name="address" required></textarea><br><br>

<label>Select Service</label><br>
<select name="service">
    <option>Birth Certificate</option>
    <option>Income Certificate</option>
    <option>Caste Certificate</option>
    <option>Domicile Certificate</option>
</select>

<br><br>

<label>Upload Document</label><br>
<input type="file" name="document" required>

<br><br>

<button type="submit">Submit Application</button>

</form>

</body>
</html>
