<!DOCTYPE html>

<html>
<head>
    <title>Income Certificate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Income Certificate</h1>

<div class="form-box">

<form action="/apply" method="POST" enctype="multipart/form-data">

```
<label>Full Name</label><br>
<input type="text" name="fullname" required><br><br>

<label>Aadhaar Number</label><br>
<input type="text" name="aadhaar" maxlength="12" required><br><br>

<label>Mobile Number</label><br>
<input type="text" name="mobile" maxlength="10" required><br><br>

<label>Address</label><br>
<textarea name="address" required></textarea><br><br>

<input type="hidden" name="service" value="Income Certificate">

<label>Upload Income Proof</label><br>
<input type="file" name="document" required><br><br>

<button type="submit">Submit Application</button>
```

</form>

</div>

</body>
</html>
